#dreamlog-duo-design .duo-hero header{display:flex;justify-content:space-between;gap:10px;align-items:center}
#dreamlog-duo-design .duo-hero header strong{font-size:21px;letter-spacing:-.7px;font-weight:600}
#dreamlog-duo-design .duo-hero header button{background:#ffffff1a;border:0;color:#fff;display:grid;place-items:center;border-radius:50%;width:36px;height:36px}
#dreamlog-duo-design .duo-hero header svg{width:22px;height:22px}
#dreamlog-duo-design .duo-copy{margin-top:50px}
#dreamlog-duo-design .duo-copy>small{font-size:11px;opacity:.85}
#dreamlog-duo-design h2{font-size:23px;line-height:1.45;font-weight:550;letter-spacing:-.6px;margin:10px 0}
#dreamlog-duo-design .duo-copy p{font-size:11px;line-height:1.7;color:#ffffffcc;margin:0}
#dreamlog-duo-design .duo-banner-link{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#fff;font-size:13px;padding:12px 0;min-height:44px;text-align:left}
#dreamlog-duo-design .duo-banner-link svg{width:15px;height:15px}
#dreamlog-duo-design .duo-pages{display:flex;justify-content:flex-end;gap:1px;margin-top:4px}
#dreamlog-duo-design .duo-pages button{width:26px;height:32px;border:0;background:transparent;position:relative}
#dreamlog-duo-design .duo-pages button:after{content:"";width:4px;height:4px;border-radius:4px;background:#fff6;position:absolute;left:11px;top:14px}
#dreamlog-duo-design .duo-pages [aria-pressed=true]:after{width:15px;left:5px;background:#fff}
#dreamlog-duo-design .duo-workspace{padding:24px 16px;display:flex;flex-direction:column;gap:20px;min-width:0}
#dreamlog-duo-design .duo-create{display:flex;align-items:center;gap:10px;border:0;text-align:left;padding:15px 12px;border-radius:15px;background:var(--duo-surface);color:var(--duo-fg);min-width:0;width:100%}
#dreamlog-duo-design .duo-create-mark{width:38px;height:38px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:var(--duo-fg);color:var(--duo-bg)}
#dreamlog-duo-design .duo-create-mark svg{width:23px;height:23px}
#dreamlog-duo-design .duo-create>span:nth-child(2){min-width:0}
#dreamlog-duo-design .duo-create strong{font-size:16px;font-weight:600;display:block}
#dreamlog-duo-design .duo-create small{display:block;font-size:11px;color:var(--duo-secondary);margin-top:5px;line-height:1.6}
#dreamlog-duo-design .duo-create>svg{margin-left:auto;width:16px;flex-shrink:0}
#dreamlog-duo-design h3{font-size:14px;font-weight:600;margin:0}
#dreamlog-duo-design .duo-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
#dreamlog-duo-design .duo-heading button{border:0;background:transparent;color:var(--duo-secondary);font-size:11px;padding:5px 0;min-width:40px;min-height:30px}

<script>
(() => {
  const root = document.getElementById('dreamlog-duo-design');
  const stage = root.querySelector('.duo-stage');
  const viewport = root.querySelector('[data-scale-viewport]');
  const content = root.querySelector('[data-scale-content]');
  const shell = root.querySelector('.duo-window');
  const options = { pose: 'wide', appearance: 'light', drafts: 3 };
  const poseWidths = { outer: 400, portrait: 560, wide: 700 };
  const scenes = [
    ['口播剪辑', '好好表达，<br>剩下的交给剪辑。', '去停顿、删口误，让口播更流畅', '试试口播剪辑'],
    ['台词成片', '想说的故事，<br>藏在每一句台词里。', '搜索、组合台词，剪出你的叙事', '试试台词成片'],
    ['视频分析', '每一段视频，<br>都值得看得更懂。', '从视频分析到分镜提示词', '开始视频分析']
  ];

  let measureFrame = 0;
  function measure() {
    cancelAnimationFrame(measureFrame);
    measureFrame = requestAnimationFrame(() => {
      const style = getComputedStyle(stage);
      const horizontalPadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const available = Math.max(1, root.clientWidth - horizontalPadding);
      const deviceWidth = poseWidths[options.pose];
      const deviceHeight = shell.offsetHeight;
      const scale = Math.min(1, available / deviceWidth);
      viewport.style.width = (deviceWidth * scale) + 'px';
      viewport.style.height = (deviceHeight * scale) + 'px';
      content.style.width = deviceWidth + 'px';
      content.style.transform = 'scale(' + scale + ')';
      root.dataset.scale = scale.toFixed(5);
      root.dataset.deviceWidth = String(deviceWidth);
      root.dataset.deviceHeight = String(deviceHeight);
      root.dataset.scaledHeight = String(deviceHeight * scale);
    });
  }

  function render() {
    shell.className = 'duo-window duo-' + options.pose;
    shell.style.width = poseWidths[options.pose] + 'px';
    shell.style.colorScheme = options.appearance === 'system' ? '' : options.appearance;
    root.querySelectorAll('[data-pose]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.pose === options.pose));
    });

    const drafts = root.querySelector('.duo-drafts');
    drafts.replaceChildren();
    root.querySelector('.duo-recent').hidden = options.drafts === 0;
    ['周末的海边', '我的口播', '旅行日记', '周五随拍'].slice(0, options.drafts).forEach((name, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'duo-draft cursor-interaction';
      button.dataset.action = '继续编辑：' + name;
      button.setAttribute('aria-label', '继续编辑：' + name);
      const span = document.createElement('span');
      span.textContent = name;
      button.append(span);
      button.style.backgroundPosition = (40 + index * 15) + '% center';
      drafts.append(button);
    });
    if (options.drafts > 0 && options.drafts < 4) {
      const empty = document.createElement('div');
      empty.className = 'duo-empty';
      empty.style.gridColumn = 'span ' + (4 - options.drafts);
      empty.textContent = '暂无更多草稿';
      drafts.append(empty);
    }
    measure();
  }

  root.querySelectorAll('[data-pose]').forEach(button => {
    button.addEventListener('click', () => {
      options.pose = button.dataset.pose;
      render();
    });
  });

  root.querySelectorAll('[data-scene]').forEach(button => {
    button.addEventListener('click', () => {
      const scene = scenes[Number(button.dataset.scene)];
      root.querySelector('.duo-banner-kind').textContent = scene[0];
      root.querySelector('h2').innerHTML = scene[1];
      root.querySelector('.duo-banner-subtitle').textContent = scene[2];
      root.querySelector('.duo-banner-link span').textContent = scene[3];
      root.querySelector('.duo-banner-link').dataset.action = scene[0];
      root.querySelectorAll('[data-scene]').forEach(other => {
        other.setAttribute('aria-pressed', String(other === button));
      });
      measure();
    });
  });

  const feedback = root.querySelector('.duo-feedback');
  root.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (target) {
      feedback.querySelector('span').textContent = '入口预览 · ' + target.dataset.action;
      feedback.hidden = false;
    }
  });
  feedback.querySelector('button').addEventListener('click', () => {
    feedback.hidden = true;
  });

  new ResizeObserver(measure).observe(root);
  window.addEventListener('resize', measure);
  window.addEventListener('load', measure);
  render();
})();
</script>
